[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenium-autocoreg"
version = "0.1.0"
description = "GT-free coregistration of in-vivo 2-photon z-stacks to Xenium spatial transcriptomics sections"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-image",
    "tifffile",
    "zarr",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
xenium-autocoreg = "xenium_autocoreg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
